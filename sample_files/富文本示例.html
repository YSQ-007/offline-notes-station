<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>富文本示例</title>
<style>
  body { font-family: sans-serif; padding: 16px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; background: #fafafa; }
  h2 { color: #2c6; }
</style>
</head>
<body>
<h2>富文本 HTML 示例</h2>
<p>这是一篇<strong>带样式的</strong>HTML 文档，用于演示本站在桌面版中的展示效果。</p>
<div class="card">
  <b>注意：</b>脚本与事件在这里不会执行（已安全处理）。
</div>
<ul>
  <li>列表一</li>
  <li>列表二</li>
</ul>
</body>
</html>
